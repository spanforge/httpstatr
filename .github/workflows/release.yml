name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo package --locked
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    needs: verify
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Verify tag matches Cargo package version
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test on supported operating system
        run: cargo test --all-targets --locked
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "httpstatr-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/httpstatr.exe" "dist/$name/"
          Copy-Item README.md,CHANGELOG.md,SECURITY.md,LICENSE,NOTICE "dist/$name/"
          Copy-Item docs,examples "dist/$name/" -Recurse
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Copy-Item "dist/$name/httpstatr.exe" "dist/httpstatr.exe"
          Expand-Archive -Path "dist/$name.zip" -DestinationPath smoke
          & "smoke/$name/httpstatr.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Packaged executable failed" }
          & "smoke/$name/httpstatr.exe" doctor
          if ($LASTEXITCODE -ne 0) { throw "Packaged runtime check failed" }
          & "smoke/$name/httpstatr.exe" --file examples/httpstatr-suite.toml --validate
          if ($LASTEXITCODE -ne 0) { throw "Packaged suite validation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: httpstatr-${{ matrix.target }}
          path: |
            dist/*.${{ matrix.archive }}
            dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.zip *.exe > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes "${flags[@]}" \
            --title "httpstatr ${GITHUB_REF_NAME#v}"
